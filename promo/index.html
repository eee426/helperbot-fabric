<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>HelperBot 宣传片</title>
<style>
  html, body { margin: 0; background: #05070a; color: #c9d3df; font-family: "Microsoft YaHei UI", "Microsoft YaHei", sans-serif; }
  body.preview { display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
  body.preview canvas { width: min(100vw, calc((100vh - 64px) * 16 / 9)); height: auto; }
  canvas { display: block; }
  #bar { display: flex; gap: 12px; align-items: center; width: min(100vw, 1200px); padding: 12px 16px; box-sizing: border-box; }
  #bar input { flex: 1; }
  #bar button { background: #1b2430; color: inherit; border: 1px solid #2a3444; border-radius: 6px; padding: 6px 14px; font: inherit; cursor: pointer; }
  #time { font-family: Consolas, monospace; min-width: 110px; text-align: right; }
  body.render #bar { display: none; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="bar">
  <button id="play">暂停</button>
  <input id="scrub" type="range" min="0" max="60" step="0.01" value="0">
  <span id="time">0.00 / 60</span>
</div>
<script src="film.js"></script>
</body>
</html>
