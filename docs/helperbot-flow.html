<title>HelperBot 行为图</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* A switchboard of task chains: chains on the left, the chain as a wired board, the chosen node beside it. */
:root{
  --bg:#eef1f3;--panel:#fbfcfc;--panel2:#e3e8ea;--line:#c3ccd1;--ink:#1c262b;--muted:#566771;--wire:#7d8f99;--accent:#0b6e7f;--accent-ink:#ffffff;
  --q:#8a5a00;--q-soft:#f7ead0;--a:#2c5e9e;--a-soft:#e0eaf7;--g:#1d7a4d;--g-soft:#dbf0e4;--b:#b03030;--b-soft:#f8e0e0;--j:#6a4bb0;--j-soft:#e9e3f7;
  --sans:"Noto Sans SC","Microsoft YaHei","PingFang SC",system-ui,sans-serif;--mono:"JetBrains Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13191d;--panel:#1b2328;--panel2:#242e34;--line:#37444c;--ink:#e6edf0;--muted:#94a6b0;--wire:#62757f;--accent:#49c1d4;--accent-ink:#0b1a1e;
  --q:#e8bf6a;--q-soft:#3b2f15;--a:#8db7ee;--a-soft:#1f3048;--g:#73d3a1;--g-soft:#183a2a;--b:#f09a9a;--b-soft:#472222;--j:#baa5ee;--j-soft:#2f2848;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13191d;--panel:#1b2328;--panel2:#242e34;--line:#37444c;--ink:#e6edf0;--muted:#94a6b0;--wire:#62757f;--accent:#49c1d4;--accent-ink:#0b1a1e;
  --q:#e8bf6a;--q-soft:#3b2f15;--a:#8db7ee;--a-soft:#1f3048;--g:#73d3a1;--g-soft:#183a2a;--b:#f09a9a;--b-soft:#472222;--j:#baa5ee;--j-soft:#2f2848;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--sans);padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:21px;margin:0;line-height:1.3;text-wrap:balance}
.sub{color:var(--muted);margin:2px 0 12px;font-size:14px}
.app{display:grid;grid-template-columns:200px minmax(0,1fr) 320px;gap:12px;align-items:start}
nav{display:flex;flex-direction:column;gap:2px;min-width:0}
nav h2{font-size:12.5px;letter-spacing:.06em;color:var(--muted);margin:10px 0 3px;font-weight:700}
nav h2:first-child{margin-top:0}
nav button{all:unset;box-sizing:border-box;cursor:pointer;padding:6px 9px;border-radius:7px;font-size:14px;display:flex;justify-content:space-between;gap:8px;align-items:center}
nav button:hover{background:var(--panel2)}
nav button[aria-current="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
nav button:focus-visible,.node:focus-visible,.opt:focus-visible,.tool:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mini{font:600 11.5px var(--mono);opacity:.85}
.mid{min-width:0}
.head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;justify-content:space-between;margin-bottom:6px}
.head h2{font-size:18px;margin:0}
.head p{margin:0;color:var(--muted);font-size:14px;flex-basis:100%}
.board{position:relative;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;max-height:calc(100vh - 150px);min-height:420px}
.stage{position:relative}
svg.wires{position:absolute;inset:0;pointer-events:none}
.wire{fill:none;stroke:var(--wire);stroke-width:1.4}
.wire.back{stroke-dasharray:5 4}
.wire.on{stroke:var(--accent);stroke-width:2.6}
.wl{font:12px var(--sans);fill:var(--muted);paint-order:stroke;stroke:var(--panel);stroke-width:4px}
.node{all:unset;box-sizing:border-box;position:absolute;width:166px;min-height:58px;padding:7px 9px 7px 12px;border-radius:8px;cursor:pointer;background:var(--s);border:1.5px solid transparent;font-size:13.5px;line-height:1.35;overflow:hidden}
.node::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--cov,var(--line))}
.node b{display:block;font-weight:600;color:var(--c)}
.node.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.node.past{border-color:var(--accent)}
.node .pc{display:block;font:600 11.5px var(--mono);color:var(--muted);margin-top:1px}
.k-q{--c:var(--q);--s:var(--q-soft)}.k-a{--c:var(--a);--s:var(--a-soft)}.k-g{--c:var(--g);--s:var(--g-soft)}.k-b{--c:var(--b);--s:var(--b-soft)}.k-e{--c:var(--muted);--s:var(--panel2)}
.side{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0;position:sticky;top:max(8px,env(safe-area-inset-top,0px))}
.kind{font-size:12.5px;font-weight:700;letter-spacing:.04em;color:var(--c)}
.side h3{margin:2px 0 4px;font-size:17px;line-height:1.35;text-wrap:balance}
.side p{margin:0 0 10px}
.opts{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:14px;display:flex;justify-content:space-between;gap:10px}
.opt:hover{background:var(--panel2)}
.opt i{font-style:normal;color:var(--muted);text-align:right;min-width:0}
.opt.jump i{color:var(--j);font-weight:600}
.code{font:13px var(--mono);word-break:break-all;background:var(--panel2);padding:7px 9px;border-radius:7px;margin-bottom:6px}
.covbar{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;margin:4px 0 3px}
.covbar span{display:block;height:100%}
.meta{font-size:13px;color:var(--muted)}
.trail{margin-top:10px;border-top:1px solid var(--line);padding-top:8px;font-size:13px;color:var(--muted)}
.trail ol{margin:4px 0 0;padding-left:20px;max-height:170px;overflow:auto}
.trail li button{all:unset;cursor:pointer;color:var(--ink)}
.trail li button:hover{text-decoration:underline}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tool{all:unset;cursor:pointer;font-size:13px;border:1px solid var(--line);border-radius:7px;padding:3px 9px}
.tool:hover{background:var(--panel2)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--muted);margin:7px 0 0}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:13px;height:13px;border-radius:3px;background:var(--s);border:1px solid var(--c);display:inline-block}
.bar{width:5px;height:14px;border-radius:2px;display:inline-block}
@media (max-width:1000px){.app{grid-template-columns:minmax(0,1fr)}nav{flex-direction:row;flex-wrap:wrap;gap:4px}nav h2{display:none}nav button{padding:5px 8px}.mini{display:none}.side{position:static}.board{max-height:60vh}}
@media (prefers-reduced-motion:no-preference){.board{scroll-behavior:smooth}}
</style>

<h1>HelperBot 行为图</h1>
<p class="sub">按任务链看它实际怎么走。点方块看说明，点右边的分支走下去。内容按提交 65d0a86 的代码写，覆盖率来自 94 个测试场景。</p>
<div class="app">
  <nav id="nav" aria-label="任务链"></nav>
  <div class="mid">
    <div class="head"><h2 id="ttl"></h2><div class="tools"><button class="tool" id="reset">回到起点</button></div><p id="lead"></p></div>
    <div class="board" id="board"><div class="stage" id="stage"></div></div>
    <div class="legend">
      <span><i class="sw k-q"></i>判断</span><span><i class="sw k-a"></i>动作</span><span><i class="sw k-g"></i>成功</span><span><i class="sw k-b"></i>失败</span>
      <span><i class="bar" style="background:var(--g)"></i>函数测试跑过 80% 以上</span><span><i class="bar" style="background:var(--q)"></i>30～80%</span><span><i class="bar" style="background:var(--b)"></i>30% 以下</span><span><i class="bar" style="background:var(--line)"></i>没有对应函数</span>
      <span>虚线：往回走</span>
    </div>
  </div>
  <aside class="side" id="side" aria-live="polite"></aside>
</div>

<script>
const CHAINS = [
{id:"tick", group:"身体", title:"每一刻干什么", lead:"服务器每秒 20 刻。每刻从上往下问，谁接管，下面的就不跑。", start:"breath", nodes:{
 breath:{k:"q",t:"要换气吗？",d:"头在水下，气只够游上去，或者有人请求换气。",c:"BotPlayer.breathe",n:[["要","jump:breath"],["不用","combat"]]},
 combat:{k:"q",t:"要打架吗？",d:"远程怪 10 格内追过去打，近战怪够得着才打。任务暂停，打完回到原来的事。",c:"BotPlayer.combat",n:[["要","fight"],["不用","eat"]]},
 fight:{k:"a",t:"打怪",d:"拿武器，蓄满力才挥。够不着就用 engage 借用移动追过去。",c:"BotPlayer.combat",n:[["这一刻结束","move"]]},
 eat:{k:"q",t:"要吃东西吗？",d:"饥饿值 14 以下，或受伤且不到 18。任务要的东西不吃，除非快饿死。",c:"BotPlayer.tryEat",n:[["要","eating"],["不用","task"]]},
 eating:{k:"a",t:"边走边吃",d:"按原版用时吃，走路减速。",c:"BotPlayer.tryEat",n:[["这一刻结束","move"]]},
 task:{k:"a",t:"跑当前任务一刻",d:"背包快满先整理，然后 task.tick()。任务决定去哪、挖哪。",c:"BotPlayer.behave",n:[["一单 get","jump:order"],["然后","move"]]},
 move:{k:"a",t:"身体动一刻",d:"身体只在这里移动。换气时由换气层自己调用。",c:"MovementController.tick",n:[["看移动","jump:step"]]}
}},
{id:"step", group:"身体", title:"移动一刻", lead:"MovementController 每刻怎么走一步。", start:"fall", nodes:{
 fall:{k:"q",t:"脚下没东西？",d:"先掉下去。正在挖的放弃，落地后重新规划。",c:"MovementController.tickMoving",n:[["是","end1"],["否","gather"]]},
 end1:{k:"e",t:"这一刻结束",d:"下一刻继续。",n:[]},
 gather:{k:"q",t:"在就地收集垫脚方块？",d:"没路可走又方块不够时，挖身边的方块。",c:"MovementController.gatherTick",n:[["是","end1"],["否","way"]]},
 way:{k:"q",t:"有洪水搜索待开始？",d:"头在水下就先去换气，头出水后才开始搜。",c:"RouteSearch.startWay",n:[["是","jump:flood"],["否","think"]]},
 think:{k:"q",t:"有搜索在跑？",d:"站着等后台线程，每刻看一眼结果。",c:"RouteSearch.continuePlanning",n:[["是","end1"],["否","bound"]]},
 bound:{k:"q",t:"走完这一步了？",d:"检查到目标没有、还在不在路线上、气够不够计划。",c:"MovementController.tickMoving",n:[["到了目标","arrived"],["路线没了","plan"],["继续走","exec"]]},
 arrived:{k:"g",t:"状态变成 ARRIVED",d:"任务下一刻看到。",n:[]},
 plan:{k:"a",t:"重新规划",d:"重新搜路。",c:"RouteSearch.startPlanning",n:[["看寻路","jump:goto"]]},
 exec:{k:"a",t:"执行这一步",d:"先挖 toBreak，再放方块，然后移动。每次挖都过总闸。",c:"MovementController.executeStep",n:[["要挖","jump:mine"],["移动","stuck"]]},
 stuck:{k:"q",t:"卡住了吗？",d:"一步比预计慢太多、前方变了、原地不动，都会重新规划。",c:"MovementController.stepTimedOut",n:[["卡住","plan"],["正常","end1"]]}
}},
{id:"mine", group:"身体", title:"挖一个方块", lead:"所有挖方块都经过这里，全局总闸的执行层。", start:"ghost", nodes:{
 ghost:{k:"q",t:"在保护区块里？",d:"幽灵状态什么都不碰。",c:"Hands.mine",n:[["是","fail"],["否","gate"]]},
 gate:{k:"q",t:"头在水下？",d:"每刻都查，挖到一半水灌进来也会停。",c:"Hands.mine",n:[["否","dig"],["是","sea"]]},
 sea:{k:"q",t:"是海里专有的方块？",d:"海带、海草、海泡菜、珊瑚，一碰就碎的才算。",c:"Guard.ofTheSea",n:[["是","dig"],["否","escape"]]},
 escape:{k:"q",t:"正在逃生？",d:"换气确实搜不到路，反射层才放行。",c:"Hands.digOut",n:[["是","dig"],["否","fail"]]},
 fail:{k:"b",t:"不挖，重新规划",d:"返回 FAILED。",n:[]},
 dig:{k:"g",t:"走原版挖掘流程",d:"换工具，按原版进度挖，服务器确认后才算挖掉。",c:"Hands.mine",n:[]}
}},
{id:"breath", group:"身体", title:"换气", lead:"反射层保命。正常情况下路线自己安排换气，这里是兜底。", start:"low", nodes:{
 low:{k:"q",t:"气只够游上去？",d:"预算不够“上去的时间 × 1.25 + 2 秒”。",c:"BotPlayer.breathe",n:[["是","route"]]},
 route:{k:"a",t:"用寻路游上去",d:"目标是任何能呼吸的地方。不挖，每秒重想一次。",c:"MovementController.headForAir",n:[["头出水了","full"],["搜不到路","climb"],["3 秒没进展","swim"]]},
 swim:{k:"a",t:"直接往上游",d:"还有路时不挖。",c:"Body.ascendStep",n:[["头出水了","full"]]},
 climb:{k:"a",t:"往上游，挖开头顶",d:"唯一能在水下挖的情况。浮着挖慢 25 倍，沙土来得及，石头基本来不及。",c:"Body.ascendStep",n:[["头出水了","full"],["气耗尽","dead"]]},
 full:{k:"g",t:"等气满，回到原来的事",d:"disengage 恢复目标，再搜一次路。",c:"MovementController.disengage",n:[]},
 dead:{k:"b",t:"淹死",d:"被堵死又挖不开时才会发生。",n:[]}
}},
{id:"order", group:"任务", title:"一单 /bot get", lead:"做一步，重新规划一次。一步失败只会得到新计划。", start:"plan", nodes:{
 plan:{k:"q",t:"够数了吗？",d:"只数这一单拿到的数量。",c:"AcquireTask.plan",n:[["够了","ret"],["不够","limit"]]},
 ret:{k:"a",t:"走回玩家身边",d:"到了说“右键我拿走”。",c:"ComeTask.followTick",n:[["看回玩家","jump:come"]]},
 limit:{k:"q",t:"超过 80 步？",d:"防止原地打转。",c:"AcquireTask.plan",n:[["是","give"],["否","think"]]},
 think:{k:"a",t:"物品规划器算计划",d:"用背包真实内容，算最省时间的一串动作，最多 4 万节点、2 秒。",c:"AcquireTask.plan",n:[["想不出","give"],["有计划","first"]]},
 first:{k:"q",t:"第一步是什么？",d:"只执行第一步，做完回到开头。同一动作连续 3 次没进展就放弃。",c:"AcquireTask.plan",n:[["采集","jump:gather"],["打猎","jump:hunt"],["合成","jump:craft"],["熔炼","jump:smelt"],["打水","jump:water"],["这一步结束","done"]]},
 done:{k:"q",t:"这一步成功了？",d:"失败记一次。在保护区里失败，先走出保护区，一单最多 2 次。",c:"AcquireTask.stepFailed",n:[["成功","plan"],["失败","count"]]},
 count:{k:"q",t:"同一物品失败 3 次？",d:"这样拿不到，就从计划里去掉这个来源。",c:"AcquireTask.stepFailed",n:[["是，不再用这个来源","plan"],["否，重新规划再试","plan"]]},
 give:{k:"b",t:"放弃这一单",d:"把原因告诉玩家。",c:"AcquireTask.giveUp",n:[]}
}},
{id:"gather", group:"任务", title:"采集", lead:"找方块、确认能到、挖、捡。一个地方一份 100 万格的搜索额度。", start:"prep", nodes:{
 prep:{k:"a",t:"分析来源",d:"读掉落表：哪些方块掉这个东西，手里的工具哪个能用。",c:"GatherTask.prepare",n:[["有工具","scan"],["没工具","no"]]},
 no:{k:"b",t:"告诉玩家需要什么",d:"这一步失败。",c:"GatherTask.prepare",n:[]},
 scan:{k:"a",t:"扫描周围 6 个区块",d:"从近到远，取最近 64 处，跳过记忆本里的。",c:"GatherTask.scan",n:[["有目标","pick"],["一个都没有","explore"]]},
 pick:{k:"a",t:"估算选一个",d:"比较最近 12 处，近处都在水里时再比岸上的。掉落物也放在一起比。",c:"GatherTask.nextTarget",n:[["选中掉落物","jump:drop"],["海里专有，头在水外","jump:flood"],["普通方块","search"],["这批都不行","scan"]]},
 search:{k:"a",t:"全量搜索这一个",d:"框住机器人和目标，能到才出发。",c:"GatherTask.goNear",n:[["看寻路","jump:goto"],["能到","walk"],["到不了","spend"]]},
 spend:{k:"q",t:"额度用完了？",d:"记下目标周围 4 格，扣掉用掉的节点数。",c:"GatherTask.spent",n:[["还有","pick"],["用完了","explore"]]},
 walk:{k:"a",t:"走过去",d:"按完整路线走，路上不用再判断。",c:"GatherTask.approach",n:[["到了","dig"],["路断了","spend"]]},
 dig:{k:"a",t:"挖",d:"看得见才挖，挡路的先挖，开挖前核对手里的工具。额度回到 100 万。",c:"GatherTask.mine",n:[["看挖方块","jump:mine"],["挖完","check"]]},
 check:{k:"q",t:"够数了吗？",d:"地上的也算。",c:"GatherTask.afterHit",n:[["够了","done"],["不够","pick"]]},
 explore:{k:"a",t:"交给探索者",d:"去下一处，到站后额度回满。",c:"GatherTask.lookFurther",n:[["看探索","jump:explore"],["找遍了","giveup"]]},
 done:{k:"g",t:"这一步完成",d:"回到一单的流程。",n:[["回一单","jump:order"]]},
 giveup:{k:"b",t:"这一步失败",d:"说明原因。",c:"GatherTask.giveUp",n:[]}
}},
{id:"explore", group:"任务", title:"探索下一处", lead:"用种子算 2000 格内的群系地图，每 48 格一个点。", start:"map", nodes:{
 map:{k:"a",t:"算地图",d:"不加载区块。普通方块跳过海洋和河流，要地下的东西再看 4 个高度。",c:"Explorer.Explorer",n:[["算好了","next"]]},
 next:{k:"q",t:"还有没看过的点？",d:"选最快拿够数的群系，同样好的选离自己和玩家都近的。",c:"Explorer.next",n:[["有","go"],["没有，圈内也没这种群系","far"],["没有","fail"]]},
 far:{k:"a",t:"去最远 1 万格外最近的一处",d:"只去一趟。",c:"GatherTask.startLocate",n:[["到了","rescan"]]},

 scanq:{k:"q",t:"脚在水里？",d:"每 5 秒看一次。海带这类东西例外，在水里也扫。",c:"GatherTask.travel",n:[["是，这次跳过","scanq2"],["否，扫 3 个区块","found"]]},
 scanq2:{k:"q",t:"到站了？",d:"走到那个点 16 格内。",c:"GatherTask.travel",n:[["到了","rescan"],["没到","scanq"]]},
 found:{k:"q",t:"扫到目标？",d:"扫到就停下来选目标。",c:"GatherTask.travel",n:[["有","rescan"],["没有","scanq2"]]},
 rescan:{k:"g",t:"回到采集扫描",d:"额度回满。",n:[["回采集","jump:gather"]]},
 fail:{k:"b",t:"找遍了或超过 10 分钟",d:"这一步失败。",n:[]}
}},
{id:"hunt", group:"任务", title:"打猎", lead:"找猎物，内核确认能到，追上去打，捡掉落物。", start:"find", nodes:{

const byId = Object.fromEntries(CHAINS.map(c => [c.id, c]));
const W = 166, H = 66, GX = 34, GY = 62, PAD = 22;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));

function covColor(p){ return p == null ? "var(--line)" : p >= 80 ? "var(--g)" : p >= 30 ? "var(--q)" : "var(--b)"; }
function pct(c){ const v = COV[c]; return v ? Math.round(100 * v.c / Math.max(1, v.c + v.m)) : null; }
function chainPct(ch){
  const seen = new Set(); let c = 0, m = 0;
  Object.values(ch.nodes).forEach(n => { if (n.c && COV[n.c] && !seen.has(n.c)) { seen.add(n.c); c += COV[n.c].c; m += COV[n.c].m; } });
  return c + m ? Math.round(100 * c / (c + m)) : null;
}

/* Rows by distance from the start; an edge to a row at or above its own is drawn dashed. */
function layout(ch){
  const depth = {[ch.start]: 0}, queue = [ch.start];
  while (queue.length) {
    const id = queue.shift();
    (ch.nodes[id].n || []).forEach(([, to]) => {
      if (!to.startsWith("jump:") && !(to in depth)) { depth[to] = depth[id] + 1; queue.push(to); }
    });
  }
  let last = Math.max(...Object.values(depth));
  Object.keys(ch.nodes).forEach(id => { if (!(id in depth)) depth[id] = ++last; });
  const rows = {};
  Object.keys(ch.nodes).forEach(id => (rows[depth[id]] = rows[depth[id]] || []).push(id));
  const widest = Math.max(...Object.values(rows).map(r => r.length));
  const width = PAD * 2 + widest * W + (widest - 1) * GX, pos = {};
  Object.entries(rows).forEach(([d, ids]) => {
    const rowW = ids.length * W + (ids.length - 1) * GX;
    ids.forEach((id, i) => pos[id] = {x: (width - rowW) / 2 + i * (W + GX), y: PAD + d * (H + GY)});
  });
  return {pos, width, height: PAD * 2 + (Object.keys(rows).length) * (H + GY) - GY};
}

function drawBoard(){
  const {pos, width, height} = layout(chain), st = $("stage");
  st.style.width = width + "px"; st.style.height = height + "px"; st.innerHTML = "";
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("class", "wires"); svg.setAttribute("width", width); svg.setAttribute("height", height);
  const steps = new Set(); for (let i = 1; i < trail.length; i++) if (trail[i - 1].c === chain.id && trail[i].c === chain.id) steps.add(trail[i - 1].n + ">" + trail[i].n);
  let out = "";
  Object.entries(chain.nodes).forEach(([id, n]) => (n.n || []).forEach(([label, to], i) => {
    if (to.startsWith("jump:") || !pos[to]) return;
    const a = pos[id], b = pos[to], back = b.y <= a.y;
    const x1 = a.x + W / 2 + (i - (n.n.length - 1) / 2) * 16, y1 = back ? a.y + H / 2 : a.y + H, x2 = b.x + W / 2, y2 = back ? b.y + H / 2 : b.y;
    const off = a.x >= b.x ? W / 2 + 14 : -W / 2 - 14;
    const d = back ? `M${a.x + (off > 0 ? W : 0)} ${y1} C${a.x + (off > 0 ? W : 0) + (off > 0 ? 28 : -28)} ${y1},${b.x + (off > 0 ? W : 0) + (off > 0 ? 28 : -28)} ${y2},${b.x + (off > 0 ? W : 0)} ${y2}`
      : `M${x1} ${y1} C${x1} ${y1 + 28},${x2} ${y2 - 28},${x2} ${y2}`;
    const on = steps.has(id + ">" + to);
    out += `<path class="wire${back ? " back" : ""}${on ? " on" : ""}" d="${d}"/>`;
    if (!back && n.n.length > 1) out += `<text class="wl" x="${(x1 + x2) / 2}" y="${y1 + 22}" text-anchor="middle">${esc(label.slice(0, 11))}</text>`;
  }));
  svg.innerHTML = out; st.appendChild(svg);
  const visited = new Set(trail.filter(t => t.c === chain.id).map(t => t.n));

    const b = document.createElement("button"), p = n.c ? pct(n.c) : null;
    b.className = `node k-${n.k}` + (id === sel ? " sel" : visited.has(id) ? " past" : "");
    b.style.left = pos[id].x + "px"; b.style.top = pos[id].y + "px"; b.style.setProperty("--cov", covColor(p));
    b.innerHTML = `<b>${esc(n.t)}</b>${p != null ? `<span class="pc">${p}%</span>` : ""}`;
    b.onclick = () => go(id);
    st.appendChild(b);
    if (id === sel && $("board").scrollTo) $("board").scrollTo({left: pos[id].x - 60, top: pos[id].y - 60});
  });
}

function drawSide(){
  const n = chain.nodes[sel], v = n.c && COV[n.c], p = n.c ? pct(n.c) : null;
  let h = `<div class="kind k-${n.k}">${KIND[n.k]}</div><h3>${esc(n.t)}</h3>${n.d ? `<p>${esc(n.d)}</p>` : ""}`;
  if ((n.n || []).length) {
    h += `<div class="opts">` + n.n.map(([label, to], i) => {
      const j = to.startsWith("jump:"), dest = j ? byId[to.slice(5)].title : chain.nodes[to].t;
      return `<button class="opt${j ? " jump" : ""}" data-i="${i}"><span>${esc(label)}</span><i>${j ? "→ " : ""}${esc(dest)}</i></button>`;
    }).join("") + `</div>`;
  }
  if (n.c) {
    h += `<div class="code">${esc(v ? v.f + ":" + v.l : n.c)}<br>${esc(n.c)}</div>`;
    if (v) h += `<div class="covbar"><span style="width:${p}%;background:${covColor(p)}"></span></div><div class="meta">测试跑过这个函数 ${p}% 的代码（${v.c} 行跑过，${v.m} 行没跑过）</div>`;
  }
  h += `<div class="trail">走过的路<ol>` + trail.map((t, i) => `<li><button data-t="${i}">${esc(byId[t.c].nodes[t.n].t)}</button></li>`).join("") + `</ol></div>`;
  $("side").innerHTML = h;
  $("side").querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const to = n.n[+b.dataset.i][1];
    to.startsWith("jump:") ? open(to.slice(5), true) : go(to);
  });
  $("side").querySelectorAll("[data-t]").forEach(b => b.onclick = () => {
    const i = +b.dataset.t, t = trail[i]; trail = trail.slice(0, i + 1);
    chain = byId[t.c]; sel = t.n; render();
  });
}

function drawNav(){
  const nav = $("nav"); nav.innerHTML = ""; let group = "";
  CHAINS.forEach(c => {
    if (c.group !== group) { group = c.group; const h = document.createElement("h2"); h.textContent = group; nav.appendChild(h); }
    const b = document.createElement("button"), p = chainPct(c);
    b.innerHTML = `<span>${esc(c.title)}</span>${p != null ? `<span class="mini">${p}%</span>` : ""}`;
    if (c === chain) b.setAttribute("aria-current", "true");
    b.onclick = () => open(c.id, false);
    nav.appendChild(b);
  });
}

function render(){
  $("ttl").textContent = chain.title; $("lead").textContent = chain.lead;
  drawNav(); drawBoard(); drawSide();
  try { history.replaceState(null, "", "#" + chain.id); } catch (e) {}
}
function go(id){ sel = id; trail.push({c: chain.id, n: id}); render(); }
function open(id, keep){
  chain = byId[id]; sel = chain.start;
  if (!keep) trail = [];
  trail.push({c: chain.id, n: sel}); render();
}
$("reset").onclick = () => open(chain.id, false);
open(byId[location.hash.slice(1)] ? location.hash.slice(1) : "order", false);
</script>
